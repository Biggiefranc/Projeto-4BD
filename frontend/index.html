<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>Lojas de Produtos Naturais</title>
</head>

<body>
<header class="topo">
  <div class="topo-cep">
    <button type="button" id="btn-alterar-cep" class="btn-topo" aria-expanded="false" aria-controls="form">Alterar CEP</button>
    <small class="cep-atual"><b>CEP atual:</b> <span id="cep-atual">—</span></small>
  </div>

  <nav class="topo-nav">
    <a href="index.html" class="btn-topo">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg>
      Início
    </a>
  
  </nav>
</header>

<main>
  <form id="form" class="busca" novalidate hidden>
    <label class="campo-cep">
      <span class="sr-only">CEP</span>
      <input id="cep" inputmode="numeric" autocomplete="postal-code" placeholder="Digite seu CEP" maxlength="9" pattern="\d{5}-?\d{3}" required>
    </label>
    <label class="campo-raio">
      <span class="sr-only">Raio</span>
      <select id="raio">
      <option value="250"> 250 m</option>
      <option value="500">500 m</option>
      <option value="1000" selected>1 km</option>
      </select>
    </label>
    <button id="btn" type="submit">Buscar</button>
  </form>

  <p class="sub">Consulte.</p>
  <div id="status" role="status" aria-live="polite"></div>
  <ul id="lista"></ul>
</main>

<script>

  const form = document.getElementById('form');
  const btnCep = document.getElementById('btn-alterar-cep');
  function mostrarForm(abrir) {
    form.hidden = !abrir;
    btnCep.setAttribute('aria-expanded', String(abrir));
    if (abrir) document.getElementById('cep').focus();
  }
  btnCep.addEventListener('click', () => mostrarForm(form.hidden));
  document.getElementById('btn-buscar-topo').addEventListener('click', () => mostrarForm(true));
</script>
<script src="script.js" defer></script>
</body>
</html>
