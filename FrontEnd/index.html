<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador de Lojas</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <div class="container">
        <div class="marca">
          <h1>Buscador de Lojas</h1>
          <p>Encontre estabelecimentos próximos de você.</p>
        </div>

        <form id="formBusca" class="busca">
          <input
            type="text"
            id="q"
            placeholder="Buscar lojas..."
            autocomplete="off"
          />

          <input
            type="text"
            id="cep"
            placeholder="Seu CEP"
            inputmode="numeric"
            maxlength="9"
            required
          />

          <button type="submit" id="btnBuscar">Buscar</button>
        </form>

        <div class="filtros">
          <div id="categorias" class="chips"></div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="titulo-resultados">
        <div>
          <h2 id="tituloResultados">Encontre lojas perto de você</h2>

          <p id="subtituloResultados">
            Informe seu CEP para começar a pesquisa.
          </p>
        </div>

        <span id="totalResultados"></span>
      </section>

      <section id="resultado" class="resultado">
        <div class="estado-vazio">
          <h3>Encontre estabelecimentos próximos</h3>
          <p>Digite seu CEP para visualizar lojas reais da região.</p>
        </div>
      </section>

      <footer>
        <p>
          Dados de estabelecimentos:
          <a
            href="https://www.openstreetmap.org/copyright"
            target="_blank"
            rel="noopener"
          >
            OpenStreetMap
          </a>
        </p>
      </footer>
    </main>
  </body>
</html>
